<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Pyrebug Studios</title>
  <meta name="robots" content="noindex">
  <!-- Styles are inlined: GitHub Pages serves this file at any missing path, so relative stylesheet links can break. -->
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0a0a; color: #f0f0f0; font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; }
    .code { font-size: clamp(88px, 18vw, 160px); font-weight: 700; line-height: 1; letter-spacing: -0.04em; color: transparent; -webkit-text-stroke: 1px #3d3d3d; margin: 0; }
    h1 { font-size: 24px; font-weight: 600; margin: 16px 0 8px; }
    p { color: #a3a3a3; margin: 0 0 28px; }
    a { display: inline-block; padding: 12px 20px; border: 1px solid #f0f0f0; border-radius: 4px; background: #f0f0f0; color: #0a0a0a; text-decoration: none; font-size: 14px; font-weight: 500; }
    a:hover { background: transparent; color: #f0f0f0; }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Page not found</h1>
    <p>That page doesn't exist, or it has moved.</p>
    <!-- If the site is served from a project subpath (username.github.io/repo/), change href to "/repo/". -->
    <a href="/">Back to Pyrebug Studios</a>
  </main>
</body>
</html>
